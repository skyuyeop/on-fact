<style>

  body { margin: 0; padding: 0; background-color: #F4F6F9; color: #0F172A; display: flex; justify-content: center; }
  .app-container { width: 100%; max-width: 680px; padding: 16px 16px 60px 16px; }

  .search-box {

  .search-box:focus { border-color: #0054a6; box-shadow: 0 0 0 3px rgba(0, 84, 166, 0.1); }

  .section-label {

  .pill-orange { background: #FFF8DB; color: #a4681d; border: 1px solid #ffcb05; }
  .pill-blue { background: #E6F0FA; color: #0054a6; }
  .pill-new { background: #0054a6; color: #ffcb05; margin-left: 5px; }

  .card-title { font-size: 16px; font-weight: 700; color: #0F172A; margin: 2px 0 6px 0; line-height: 1.4; }
  .card-meta { font-size: 12px; color: #64748B; }

  details.card-details { background: #F8FAFC; border-top: 1px dashed #CBD5E1; }
  details.card-details summary {
    padding: 10px 18px; font-size: 13px; font-weight: 700; color: #0054a6; cursor: pointer; list-style: none;
  }
  details.card-details summary::-webkit-details-marker { display: none; }
  details.card-details summary::before { content: "▸ "; }
  details.card-details[open] summary::before { content: "▾ "; }
  .details-inner { padding: 4px 18px 16px 18px; font-size: 13.5px; line-height: 1.6; color: #1E293B; }

  .share-box {

    margin-top: 8px; background: #0054a6; color: #FFF; border: none; padding: 8px 14px;

  .region-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

<script>

const DEFAULT_DATA = [
  { id: 1, is_new: false, region: "서울", keywords: ["강남역", "흉기", "칼부림", "테러", "예고"], title: "오늘 밤 강남역 일대 흉기난동 예고글 유포 건", status: "허위 사실 (루머)", badge_color: "red", summary: "SNS에 유포 중인 강남역 테러 예고 캡처본은 과거 게시물을 조작한 허위 사실로 확인되었습니다.", action: "관할 경찰서 기동순찰대 집중 배치 완료 및 최초 유포자 IP 추적 수사 착수.", location: "서울 강남구 강남역 일대", lat: 37.4979, lon: 127.0276, updated_at: "2026-11-14 14:20" },
  { id: 2, is_new: false, region: "전국 공통", keywords: ["부고장", "청첩장", "스미싱", "링크", "결제"], title: "지인 사칭 모바일 부고장 문자 클릭 시 소액결제 피해 주의", status: "사실 확인 (경보 발령)", badge_color: "orange", summary: "지인 번호를 도용해 악성 앱(.apk) 설치를 유도하는 신종 스미싱 문자가 전국적으로 유포 중입니다.", action: "출처 불명 URL 클릭 금지. 클릭 시 즉시 비행기 모드 전환 후 112 신고 및 '시티즌코난'으로 악성앱 삭제.", location: "전국 공통 (사이버수사국)", lat: 37.5665, lon: 126.9780, updated_at: "2026-11-14 11:05" },
  { id: 3, is_new: false, region: "인천·경기", keywords: ["송도", "싱크홀", "도로", "붕괴", "통제"], title: "인천 송도 국제업무지구역 인근 도로 침하 발생 건", status: "일부 사실 (조치 완료)", badge_color: "blue", summary: "상수도관 누수로 인한 소규모 아스팔트 침하가 발생했으나 인명 피해는 전혀 없습니다.", action: "관할 지구대 교통 통제 하에 긴급 복구 작업이 완료되어 현재 정상 통행 가능합니다.", location: "인천 연수구 송도동", lat: 37.3915, lon: 126.6432, updated_at: "2026-11-14 16:40" }
];

  "서울대입구": [37.4812, 126.9527, "서울"], "강남역": [37.4979, 127.0276, "서울"], "홍대입구": [37.5572, 126.9247, "서울"],

};

let factDB = [...DEFAULT_DATA];
let selectedRegion = "전체";
let globalMap = null, regionMap = null;

// 클라우드 DB에서 데이터 불러오기
async function loadFromCloud() {
  if (!FIREBASE_URL.startsWith("http")) {
    document.getElementById("syncBadge").innerText = "● 로컬 모드 (FIREBASE_URL 미설정)";
    renderAll();
    return;
  }
  try {
    const res = await fetch(`${FIREBASE_URL}/fact_db.json`);
    const data = await res.json();
    if (data && Array.isArray(data)) {
      factDB = data;
    } else {
      await saveToCloud(DEFAULT_DATA);
    }
    document.getElementById("syncBadge").innerText = "● 클라우드 실시간 동기화 연결됨 (모바일·PC 연동 중)";
    renderAll();
  } catch (e) {
    document.getElementById("syncBadge").innerText = "● 오프라인 모드 (네트워크 확인 필요)";
    renderAll();
  }
}

// 클라우드 DB에 데이터 저장하기
async function saveToCloud(newData) {
  factDB = newData;
  if (FIREBASE_URL.startsWith("http")) {
    await fetch(`${FIREBASE_URL}/fact_db.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(newData)
    });
  }
}

function createCardHTML(item) {
  const newBadge = item.is_new ? '<span class="pill pill-new">NEW</span>' : '';
  const shareText = `[경찰청 공식 팩트체크]\n■ 사안: ${item.title}\n■ 판정: ${item.status}\n■ 내용: ${item.summary}\n■ 조치: ${item.action}`;
  const kws = item.keywords || [];
  return `
    <div class="fact-card ${item.badge_color}">
      <div class="card-body">
        <div><span class="pill pill-${item.badge_color}">${item.status}</span>${newBadge}</div>
        <div class="card-title">${item.title}</div>
        <div class="card-meta">권역 · ${item.region}  |  관할 · ${item.location}  |  확인 · ${item.updated_at}</div>
      </div>
      <details class="card-details">
        <summary>공식 확인 사실 및 단톡방 정정 카드 보기</summary>
        <div class="details-inner">
          <div><strong>[경찰 확인 사실]</strong><br>${item.summary}</div>
          <div style="margin-top:8px;"><strong>[현장 조치 및 행동 요령]</strong><br>${item.action}</div>
          <div class="share-box" id="share-${item.id}">${shareText}</div>
          <button class="btn-copy" onclick="copyShare(${item.id})">단톡방 정정 카드 텍스트 복사</button>
        </div>
      </details>
    </div>
  `;
}

function copyShare(id) {
  const txt = document.getElementById("share-" + id).innerText;
  navigator.clipboard.writeText(txt).then(() => alert("공식 팩트체크 카드가 복사되었습니다."));
}

function switchTab(tabId, btn) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  btn.classList.add("active");
  if (tabId === "tab3") setTimeout(renderRegionTab, 50);
  if (tabId === "tab4") setTimeout(renderGlobalMap, 50);
}

function renderAll() {
  const newItems = factDB.filter(i => i.is_new);
  document.getElementById("btn-tab2").innerText = `실시간 업데이트 (${newItems.length})`;

  const q = document.getElementById("mainSearch").value.trim();
  const tab1El = document.getElementById("tab1-content");
  if (q) {
    const matched = factDB.filter(i => (i.keywords || []).some(k => q.includes(k)) || i.title.includes(q) || i.summary.includes(q) || i.location.includes(q));
    tab1El.innerHTML = `<div class="section-label">통합 검색 결과 (${matched.length}건 확인됨)</div>` +
      (matched.length ? matched.map(createCardHTML).join("") : `<div class="empty-msg">현재 경찰청 공식 DB에 등록되지 않은 새로운 루머입니다.<br><br><button class="btn-copy" onclick="alert('경찰청 상황실로 긴급 팩트체크 검증 요청이 접수되었습니다.')">긴급 팩트체크 검증 요청하기</button></div>`);
  } else {
    const baseItems = factDB.filter(i => !i.is_new);
    tab1El.innerHTML = `<div class="section-label">경찰청 주요 위기관리 팩트체크 브리핑</div>` + baseItems.map(createCardHTML).join("");
  }

  const tab2El = document.getElementById("tab2-content");
  tab2El.innerHTML = newItems.length ? newItems.map(createCardHTML).join("") : `<div class="empty-msg">현재 추가 업데이트된 신규 팩트체크 내역이 없습니다.</div>`;

  const regions = ["전체", "서울", "인천·경기", "대전·충청", "대구·경북", "부산·울산·경남", "광주·전라", "전국 공통"];
  document.getElementById("regionChips").innerHTML = regions.map(r => `<button class="chip ${selectedRegion === r ? 'active' : ''}" onclick="selectRegion('${r}')">${r}</button>`).join("");
}

function selectRegion(r) {
  selectedRegion = r;
  renderAll();
  renderRegionTab();
}

function updateLeafletMap(mapInstance, containerId, items) {
  if (!mapInstance) {
    mapInstance = L.map(containerId).setView([36.8, 127.3], 7);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap' }).addTo(mapInstance);
  }
  mapInstance.invalidateSize();
  mapInstance.eachLayer(layer => { if (layer instanceof L.Marker) mapInstance.removeLayer(layer); });
  const bounds = [];
  items.forEach(i => {
    L.marker([i.lat, i.lon]).addTo(mapInstance).bindPopup(`<b>[${i.status}]</b><br>${i.title}<br><small>${i.location}</small>`);
    bounds.push([i.lat, i.lon]);
  });
  if (bounds.length === 1) mapInstance.setView(bounds[0], 13);
  else if (bounds.length > 1) mapInstance.fitBounds(bounds, { padding: [30, 30] });
  return mapInstance;
}

function renderRegionTab() {
  const subQ = document.getElementById("regionSearch").value.trim();
  const filtered = factDB.filter(i => {
    const regOk = selectedRegion === "전체" || i.region === selectedRegion;
    const kwOk = !subQ || i.location.includes(subQ) || i.title.includes(subQ);
    return regOk && kwOk;
  });
  regionMap = updateLeafletMap(regionMap, "regionMap", filtered);
  document.getElementById("tab3-content").innerHTML = filtered.length ? filtered.map(createCardHTML).join("") : `<div class="empty-msg">'${selectedRegion}' 조건에 해당하는 브리핑이 없습니다.</div>`;
}

function renderGlobalMap() {
  globalMap = updateLeafletMap(globalMap, "globalMap", factDB);
  document.getElementById("tab4-list").innerHTML = factDB.map(i => `<div style="background:#FFF; padding:10px 14px; border-radius:8px; margin-bottom:6px; font-size:13px; border:1px solid #E2E8F0;"><strong>${i.location}</strong> · ${i.title} <span style="color:#0054a6; font-weight:700;">[${i.status}]</span></div>`).join("");
}

async function addNewFact() {
  const title = document.getElementById("inTitle").value.trim();
  const summary = document.getElementById("inSummary").value.trim();
  if (!title || !summary) return alert("사안 제목과 경찰 확인 사실은 필수 입력 항목입니다.");

  const status = document.getElementById("inStatus").value;
  const regSel = document.getElementById("inRegion").value;
  const locText = document.getElementById("inLocation").value.trim() || "전국 공통";
  const kwRaw = document.getElementById("inKeywords").value.trim();
  const action = document.getElementById("inAction").value.trim() || "관할 경찰서에서 안전 조치 완료하였습니다.";

  let lat = 37.5665, lon = 126.9780, autoReg = "전국 공통";
  for (const [key, coords] of Object.entries(LANDMARKS)) {
    if (locText.includes(key)) { [lat, lon, autoReg] = coords; break; }
  }
  const finalReg = regSel === "자동 판별" ? autoReg : regSel;
  const colorMap = { "허위 사실 (루머)": "red", "사실 확인 (경보 발령)": "orange", "일부 사실 (조치 완료)": "blue" };
  const now = new Date();
  const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const updatedList = [{
    id: Date.now(), is_new: true, region: finalReg,
    keywords: kwRaw ? kwRaw.split(",").map(s => s.trim()) : title.split(" "),
    title, status, badge_color: colorMap[status], summary, action, location: locText, lat, lon, updated_at: timeStr
  }, ...factDB];

  await saveToCloud(updatedList);

  document.getElementById("inTitle").value = "";
  document.getElementById("inLocation").value = "";
  document.getElementById("inKeywords").value = "";
  document.getElementById("inSummary").value = "";
  document.getElementById("inAction").value = "";

  renderAll();
  alert(`공식 브리핑이 게시되었습니다! (${finalReg} · ${locText})\n모바일과 PC 모든 기기에 실시간 반영됩니다.`);
}

async function resetData() {
  await saveToCloud([...DEFAULT_DATA]);
  renderAll();
  alert("초기 기본 데이터로 복원되었습니다.");
}

// 초기 실행 및 5초마다 다른 기기에서 등록한 새 데이터 자동 동기화
loadFromCloud();
setInterval(loadFromCloud, 5000);
</script>
